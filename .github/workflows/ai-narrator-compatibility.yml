name: AI narrator compatibility
on:
  push:
    branches: [feature/ai-narrator]
    paths:
      - "ai-narrator/**"
      - "app/reshaped.gradle"
      - "app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerScreen.kt"
      - ".github/workflows/ai-narrator-compatibility.yml"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional official NuvioTV tag for noncommitting worktree merge test"
        required: false
        type: string
  pull_request:
    paths:
      - "ai-narrator/**"
      - "app/reshaped.gradle"
      - "app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerScreen.kt"
      - ".github/workflows/ai-narrator-compatibility.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Check adapter contracts and modification budget
        run: |
          git fetch origin main
          python3 ai-narrator/tools/check_contracts.py
          git diff --check
      - name: Compile and unit tests
        run: |
          ./gradlew :app:compileFullDebugKotlin --no-daemon
          ./gradlew :app:testFullDebugUnitTest --tests '*NarratorCoreTest*' --no-daemon
      - name: Isolated upstream merge and compile (manual request only)
        if: github.event_name == 'workflow_dispatch' && inputs.upstream_tag != ''
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: bash ai-narrator/tools/merge_dry_run.sh "$UPSTREAM_TAG"
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-narrator-compatibility
          path: upstream-compatibility-report.txt
          if-no-files-found: warn
